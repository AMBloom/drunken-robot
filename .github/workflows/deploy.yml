# Builds main and publishes the static output to the `deploy` branch.
# DigitalOcean App Platform serves `deploy` as a static site with no build step.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: deploy
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "drunken-robot-deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
